name: Release KinetiCanvas

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag version (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build Multi-Platform Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification test suite
        run: pnpm check

      - name: Build Studio web bundle
        run: pnpm --filter @kineticanvas/studio build

      - name: Package Release Bundles
        run: |
          mkdir -p release-dist
          # Package Web & Desktop Studio bundle
          tar -czf release-dist/kineticanvas-studio-web-${{ github.ref_name || github.event.inputs.tag }}.tar.gz -C apps/studio/dist .
          
          # Package CLI & MCP bundle
          tar -czf release-dist/kineticanvas-tools-${{ github.ref_name || github.event.inputs.tag }}.tar.gz packages/ examples/ README.md
          
          # Create Checksums
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          draft: false
          prerelease: false
          name: "KinetiCanvas Studio ${{ github.ref_name || github.event.inputs.tag }}"
          body: |
            ## KinetiCanvas Studio Release ${{ github.ref_name || github.event.inputs.tag }}
            
            ### ✨ Features Included:
            - **All 6 Companions with Individual Powers:**
              - **Pomo:** Sprout Blob (Mind Bubble Matrix, Zen Focus)
              - **Fynn:** Plush Fox (Chromatic Realization, Vector Transmutation)
              - **Olli:** Feathered Owl (Predictive Telemetry, Multi-Metric 3D Charts)
              - **Nixi:** Coral-Gilled Axolotl (Web Teleportation, Retro Browser Console)
              - **Ember:** Teal Baby Dragon (Code Ignition, Harmonic Audio Synthesis)
              - **Kipi:** Cosmic Plush Maker (Agent Telepathy, Spectrum Equalizer)
            - **Interactive Motions:** Idle, Walk, Think, Work, Review, Sleep.
            - **Task Cues:** Analytics, Browser (Chrome), Design (Canva), Document, Music, Terminal.
            - **Procedural Audio Synthesizer:** Real synthesized tones and chimes matching each companion's power frequency.
            - **Multi-Format Export Engine:** PNG, standalone vector SVG, animated WebM video, React JSX code, and `.kineti.json` project package.
            - **Local MCP Server:** `@kineticanvas/mcp` for Antigravity, Claude Code, and Codex.
            - **CLI Tool:** `kineti` for terminal automation and project validation.
